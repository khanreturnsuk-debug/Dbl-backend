<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Real Database</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .login-box { max-width: 400px; margin: 100px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); text-align: center; }
        .login-box input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        .login-box button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .error-msg { color: red; font-size: 14px; display: none; margin-top: 10px; }
        h2 { color: #333; border-bottom: 2px solid #ddd; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #007bff; color: white; }
        .btn-accept { background-color: #28a745; color: white; border: none; padding: 6px 12px; cursor: pointer; border-radius: 4px; }
        .btn-reject { background-color: #dc3545; color: white; border: none; padding: 6px 12px; cursor: pointer; border-radius: 4px; }
        .status-approved { color: green; font-weight: bold; }
        .status-rejected { color: red; font-weight: bold; }
        .status-pending { color: orange; font-weight: bold; }
        #dashboardSection { display: none; }
    </style>
</head>
<body>

<!-- Login Section -->
<div id="loginSection" class="login-box">
    <h2>Admin Login</h2>
    <input type="text" id="adminUser" placeholder="Admin Username">
    <input type="password" id="adminPass" placeholder="Admin Password">
    <button onclick="checkLogin()">Login</button>
    <div id="errorMsg" class="error-msg">غلط یوزر نیم یا پاس ورڈ!</div>
</div>

<!-- Main Dashboard Section -->
<div id="dashboardSection" class="container">
    <h2>Admin Dashboard - Real Database Management</h2>

    <h3>Users Information & Referrals</h3>
    <table>
        <thead>
            <tr>
                <th>User ID</th>
                <th>Username</th>
                <th>VIP Level</th>
                <th>Referred By / Referrals</th>
            </tr>
        </thead>
        <tbody id="usersTableBody">
            <!-- Data from server -->
        </tbody>
    </table>

    <h3 style="margin-top: 40px;">Withdrawal Requests</h3>
    <table>
        <thead>
            <tr>
                <th>Request ID</th>
                <th>User ID</th>
                <th>Amount</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="withdrawalTableBody">
            <!-- Data from server -->
        </tbody>
    </table>
</div>

<script>
    const correctAdminUser = "admin";
    const correctAdminPass = "12345";

    function checkLogin() {
        const userInput = document.getElementById('adminUser').value;
        const passInput = document.getElementById('adminPass').value;
        const errorMsg = document.getElementById('errorMsg');

        if (userInput === correctAdminUser && passInput === correctAdminPass) {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('dashboardSection').style.display = 'block';
            loadRealDashboardData();
        } else {
            errorMsg.style.display = 'block';
        }
    }

    async function loadRealDashboardData() {
        try {
            // Fetch users from backend API
            const userRes = await fetch('/api/admin/users');
            const users = await userRes.json();
            
            const userTable = document.getElementById('usersTableBody');
            userTable.innerHTML = '';
            
            if (users.length === 0) {
                userTable.innerHTML = `<tr><td colspan="4" style="text-align:center;">کوئی یوزر موجود نہیں ہے</td></tr>`;
            } else {
                users.forEach(user => {
                    userTable.innerHTML += `
                        <tr>
                            <td>${user.id}</td>
                            <td>${user.username}</td>
                            <td>${user.vipLevel}</td>
                            <td>${user.referral}</td>
                        </tr>
                    `;
                });
            }

            // Fetch withdrawals from backend API
            const txRes = await fetch('/api/admin/withdrawals');
            const withdrawals = await txRes.json();

            const withdrawalTable = document.getElementById('withdrawalTableBody');
            withdrawalTable.innerHTML = '';

            if (withdrawals.length === 0) {
                withdrawalTable.innerHTML = `<tr><td colspan="5" style="text-align:center;">کوئی ودڈراول ریکوئسٹ موجود نہیں ہے</td></tr>`;
            } else {
                withdrawals.forEach(item => {
                    let statusClass = 'status-pending';
                    if (item.status === 'Approved') statusClass = 'status-approved';
                    if (item.status === 'Rejected') statusClass = 'status-rejected';

                    withdrawalTable.innerHTML += `
                        <tr>
                            <td>${item._id}</td>
                            <td>${item.userId || 'N/A'}</td>
                            <td>$${item.amount || 0}</td>
                            <td><span class="${statusClass}" id="status-${item._id}">${item.status || 'Pending'}</span></td>
                            <td>
                                <button class="btn-accept" onclick="updateWithdrawal('${item._id}', 'Approved')">Accept</button>
                                <button class="btn-reject" onclick="updateWithdrawal('${item._id}', 'Rejected')">Reject</button>
                            </td>
                        </tr>
                    `;
                });
            }
        } catch (err) {
            console.error('Error loading data:', err);
        }
    }

    async function updateWithdrawal(reqId, newStatus) {
        try {
            const response = await fetch('/api/admin/withdrawal/update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ reqId: reqId, status: newStatus })
            });
            const result = await response.json();
            
            if (result.success) {
                const statusSpan = document.getElementById(`status-${reqId}`);
                statusSpan.innerText = newStatus;
                statusSpan.className = newStatus === 'Approved' ? 'status-approved' : 'status-rejected';
            } else {
                alert('اپ ڈیٹ کرنے میں مسئلہ پیش آیا');
            }
        } catch (err) {
            console.error('Error updating withdrawal:', err);
        }
    }
</script>

</body>
</html>
