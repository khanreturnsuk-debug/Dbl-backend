<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DBL Admin Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #0d1117; color: #fff; padding: 15px; }
        .header { display: flex; justify-content: space-between; align-items: center; background: #21262d; padding: 15px; border-radius: 8px; margin-bottom: 20px; position: relative; }
        .menu-dots { font-size: 24px; cursor: pointer; background: none; border: none; color: #fff; }
        .dropdown-menu { display: none; position: absolute; right: 15px; top: 60px; background: #161b22; border: 1px solid #30363d; border-radius: 8px; overflow: hidden; z-index: 100; width: 200px; }
        .dropdown-menu button { width: 100%; padding: 12px; text-align: left; background: none; border: none; color: #fff; cursor: pointer; border-bottom: 1px solid #30363d; font-size: 14px; }
        .dropdown-menu button:hover { background: #21262d; color: #2ea043; }
        .section { display: none; }
        .section.active { display: block; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; background: #161b22; }
        th, td { border: 1px solid #30363d; padding: 10px; text-align: left; }
        th { background: #21262d; color: #2ea043; }
        .btn-approve { background: #2ea043; color: #fff; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
        .btn-reject { background: #f85149; color: #fff; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
        .form-control { width: 100%; padding: 10px; background: #0d1117; border: 1px solid #30363d; color: #fff; border-radius: 6px; margin-bottom: 10px; }
        .action-btn { background: #2ea043; color: #fff; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <h2>DBL Admin Panel</h2>
        <button class="menu-dots" onclick="toggleMenu()">⋮</button>
        <div class="dropdown-menu" id="adminMenu">
            <button onclick="switchTab('users')">👥 Users Info</button>
            <button onclick="switchTab('withdrawals')">💸 Withdrawals</button>
            <button onclick="switchTab('deposits')">💳 Deposits</button>
            <button onclick="switchTab('privacy')">🔒 Users Passwords</button>
            <button onclick="switchTab('announcements')">📢 Announcements</button>
        </div>
    </div>

    <div id="tab-users" class="section active">
        <h3>Registered Users</h3>
        <table>
            <thead>
                <tr>
                    <th>Username</th>
                    <th>Full Name</th>
                    <th>Balance</th>
                    <th>VIP Level</th>
                </tr>
            </thead>
            <tbody id="users-table-body"></tbody>
        </table>
    </div>

    <div id="tab-withdrawals" class="section">
        <h3>Withdrawal Requests</h3>
        <table>
            <thead>
                <tr>
                    <th>Username</th>
                    <th>Method & Details</th>
                    <th>Amount</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="withdrawals-table-body"></tbody>
        </table>
    </div>

    <div id="tab-deposits" class="section">
        <h3>Deposit Requests</h3>
        <table>
            <thead>
                <tr>
                    <th>Username</th>
                    <th>Method & Details</th>
                    <th>Amount</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="deposits-table-body"></tbody>
        </table>
    </div>

    <div id="tab-privacy" class="section">
        <h3>Users Passwords & Credentials</h3>
        <table>
            <thead>
                <tr>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Password</th>
                </tr>
            </thead>
            <tbody id="privacy-table-body"></tbody>
        </table>
    </div>

    <div id="tab-announcements" class="section">
        <h3>Update App Announcement</h3>
        <textarea id="announcement-input" class="form-control" rows="5" placeholder="Enter new announcement text..."></textarea>
        <button class="action-btn" onclick="updateAnnouncement()">Save Announcement</button>
    </div>

    <script>
        function toggleMenu() {
            const menu = document.getElementById('adminMenu');
            menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
        }

        function switchTab(tabId) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.getElementById(`tab-${tabId}`).classList.add('active');
            toggleMenu();
            loadData(tabId);
        }

        async function loadData(tab) {
            if (tab === 'users' || tab === 'privacy') {
                const res = await fetch('/api/admin/users');
                const users = await res.json();
                
                if (tab === 'users') {
                    const tbody = document.getElementById('users-table-body');
                    tbody.innerHTML = users.map(u => `<tr><td>${u.username}</td><td>${u.fullName}</td><td>$${u.balance}</td><td>${u.vipLevel || 'VIP 1'}</td></tr>`).join('');
                } else if (tab === 'privacy') {
                    const tbody = document.getElementById('privacy-table-body');
                    tbody.innerHTML = users.map(u => `<tr><td>${u.username}</td><td>${u.email}</td><td>${u.password}</td></tr>`).join('');
                }
            } else if (tab === 'withdrawals') {
                const res = await fetch('/api/admin/withdrawals');
                const data = await res.json();
                const tbody = document.getElementById('withdrawals-table-body');
                tbody.innerHTML = data.map(item => `
                    <tr>
                        <td>${item.username}</td>
                        <td>${item.method} - ${item.accountDetails}</td>
                        <td>$${item.amount}</td>
                        <td>${item.status}</td>
                        <td>
                            ${item.status === 'Pending' ? `<button class="btn-approve" onclick="updateStatus('${item._id}', 'Approved')">Approve</button> <button class="btn-reject" onclick="updateStatus('${item._id}', 'Rejected')">Reject</button>` : item.status}
                        </td>
                    </tr>
                `).join('');
            } else if (tab === 'deposits') {
                const res = await fetch('/api/admin/deposits');
                const data = await res.json();
                const tbody = document.getElementById('deposits-table-body');
                tbody.innerHTML = data.map(item => `
                    <tr>
                        <td>${item.username}</td>
                        <td>${item.method} - ${item.accountDetails}</td>
                        <td>$${item.amount}</td>
                        <td>${item.status}</td>
                        <td>
                            ${item.status === 'Pending' ? `<button class="btn-approve" onclick="updateStatus('${item._id}', 'Approved')">Approve</button> <button class="btn-reject" onclick="updateStatus('${item._id}', 'Rejected')">Reject</button>` : item.status}
                        </td>
                    </tr>
                `).join('');
            }
        }

        async function updateStatus(reqId, status) {
            const res = await fetch('/api/admin/transaction/update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ reqId, status })
            });
            const result = await res.json();
            if (result.success) {
                alert('Status updated successfully!');
                location.reload();
            } else {
                alert('Failed to update status');
            }
        }

        async function updateAnnouncement() {
            const text = document.getElementById('announcement-input').value;
            const res = await fetch('/api/admin/announcement/update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text })
            });
            const result = await res.json();
            if (result.success) {
                alert('Announcement updated successfully!');
            } else {
                alert('Failed to update announcement');
            }
        }

        // Load initial users tab data on start
        loadData('users');
    </script>
</body>
</html>
